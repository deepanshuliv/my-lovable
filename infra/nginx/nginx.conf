worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Query strings are logged by default. A user's database url must never reach an access
  # log, so the secrets route below turns logging off entirely — and no secret is ever
  # placed in a URL in the first place.
  log_format  main  '$remote_addr - $status "$request_method $uri" '
                    'upstream=$upstream_addr rt=$request_time';
  access_log  /var/log/nginx/access.log main;
  error_log   /var/log/nginx/error.log warn;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  # An agent turn can run for many minutes — a build, an install, a slow model. The
  # defaults would cut the SSE connection long before that.
  proxy_connect_timeout 30s;
  proxy_send_timeout    3600s;
  proxy_read_timeout    3600s;
  send_timeout          3600s;

  ##
  # Pull the project id out of whichever route carries it, so every request for one
  # project hashes to the same backend. Requests with no project id hash on the client
  # address instead, which is fine — they are stateless.
  ##
  # Each named capture declares an nginx variable, so the two branches need distinct
  # names — reusing `pid` twice is a duplicate variable declaration and nginx refuses to
  # start.
  map $request_uri $projectid {
    default                                       $remote_addr;
    "~^/chat/(?<chat_pid>[0-9a-fA-F-]+)"          $chat_pid;
    "~^/projects/(?<proj_pid>[0-9a-fA-F-]+)"      $proj_pid;
  }

  ##
  # Load balancing across backend replicas.
  #
  # `hash $projectid consistent` is the important line. Any backend can serve any project
  # — the Redis lock guarantees correctness regardless — but a project whose requests keep
  # landing on the same replica reuses that replica's warm sandbox handle instead of
  # fighting over the lock and getting 409s. Consistent hashing means adding or removing a
  # replica reshuffles a fraction of projects rather than all of them.
  ##
  upstream backend_pool {
    hash $projectid consistent;

    server backend-1:8000 max_fails=3 fail_timeout=15s;
    server backend-2:8000 max_fails=3 fail_timeout=15s;

    keepalive 32;
  }

  upstream web_pool {
    server web:3001;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    # --- API ---------------------------------------------------------------

    # SSE. Buffering here would hold every token until the turn ended, which would make
    # the whole product feel broken; the backend also sets X-Accel-Buffering: no.
    # NOTE: chunked_transfer_encoding must NOT be disabled for SSE — it is what allows
    # nginx to forward each chunk (event) to the browser as it arrives instead of
    # accumulating the entire response and delivering it on connection close.
    location /chat/ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
      proxy_cache off;
    }

    # Wake SSE stream — same no-buffer treatment as /chat/.
    location ~ ^/projects/[^/]+/wake {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
      proxy_cache off;
    }

    # Secrets travel in the request body. Logging is off so nothing about this request is
    # written to disk, and buffering stays on because it is an ordinary short request.
    location ~ ^/projects/[^/]+/secrets {
      access_log off;

      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(projects|answer|health|whoami) {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Builder UI --------------------------------------------------------

    location / {
      proxy_pass http://web_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
