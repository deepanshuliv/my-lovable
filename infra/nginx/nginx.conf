worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $status "$request_method $uri" '
                    'upstream=$upstream_addr rt=$request_time';
  access_log  /var/log/nginx/access.log main;
  error_log   /var/log/nginx/error.log warn;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  proxy_connect_timeout 30s;
  proxy_send_timeout    3600s;
  proxy_read_timeout    3600s;
  send_timeout          3600s;

  map $request_uri $projectid {
    default                                       $remote_addr;
    "~^/chat/(?<chat_pid>[0-9a-fA-F-]+)"          $chat_pid;
    "~^/projects/(?<proj_pid>[0-9a-fA-F-]+)"      $proj_pid;
  }

  upstream backend_pool {
    hash $projectid consistent;

    server backend-1:8000 max_fails=3 fail_timeout=15s;
    server backend-2:8000 max_fails=3 fail_timeout=15s;

    keepalive 32;
  }

  upstream web_pool {
    server web:3001;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    location /chat/ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
      proxy_cache off;
    }

    location ~ ^/projects/[^/]+/wake {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
      proxy_cache off;
    }

    location ~ ^/projects/[^/]+/secrets {
      access_log off;

      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(projects|answer|health|whoami|me|github)(/|$) {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
